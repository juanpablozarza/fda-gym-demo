[project]
name = "fdagym"
version = "0.1.0"
description = "FDA-Gym public demo: a tool-use RL environment over a frozen openFDA snapshot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Juan Pablo Zarza" }]
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "litellm==1.106.2",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "referencing>=0.35",
    "wandb>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/juanpablozarza/fda-gym-demo"
Repository = "https://github.com/juanpablozarza/fda-gym-demo"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdagym"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
